services:
  service:
    image: myapp
    container_name: api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=postgres
    networks:
      - mynet
    depends_on:
      postgres:
        condition: service_healthy 

  postgres:
    image: postgres:15-alpine
    container_name: psgr
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=21282908
      - POSTGRES_DB=usersdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  mynet:
    driver: bridge

volumes:
  postgres-data:

      
