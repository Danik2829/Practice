services:
  service:
    build: .
    image: myapp
    container_name: api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
    networks:
      - mynet
    depends_on:
      postgres:
        condition: service_healthy 

  postgres:
    image: postgres:15-alpine
    container_name: psgr
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mynet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      - "up"
    networks:
      - mynet
    depends_on:
      postgres:
        condition: service_healthy

networks:
  mynet:
    driver: bridge

volumes:
  postgres-data:

      
