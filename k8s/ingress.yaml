apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-api-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-api-service
                port:
                  number: 8080