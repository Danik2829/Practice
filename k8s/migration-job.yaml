apiVersion: batch/v1
kind: Job
metadata:
  name: user-migration
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: users-migration:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-path=/migrations"
            - "-database=postgres://postgres:21282908@postgres:5432/usersdb?sslmode=disable"
            - "up"
      restartPolicy: Never